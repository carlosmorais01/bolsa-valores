name: CI/CD

on:
  push:
    branches: [homol, main]
  pull_request:
    branches: [homol, main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar
        run: mvn -B compile

  static-analysis:
    name: Verificação estática (CodeQL)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: autobuild
      - name: Executar análise CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Rodar testes unitários
        run: mvn -B test

  integration-tests:
    name: Testes de integração
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Rodar testes de integração
        run: mvn -B verify

  deploy-homologacao:
    name: Deploy em homologação
    runs-on: ubuntu-latest
    needs: [static-analysis, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/homol'
    environment: homologacao
    steps:
      - name: Disparar deploy no Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  deploy-producao:
    name: Deploy em produção
    runs-on: ubuntu-latest
    needs: [static-analysis, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: producao
    steps:
      - name: Disparar deploy no Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
