name: CI/CD

on:
  push:
    branches: [homol, main]
  pull_request:
    branches: [homol, main]

jobs:
  verify:
    name: Verificação
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  deploy-homologacao:
    name: Deploy em homologação
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/homol'
    environment: homologacao
    steps:
      - name: Disparar deploy no Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
