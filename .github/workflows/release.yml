name: Release

on:
  push:
    tags: ['v*']

jobs:
  guard-tag-on-main:
    name: Confirmar que a tag está em main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verificar que o commit da tag pertence à main
        run: git merge-base --is-ancestor ${{ github.sha }} origin/main

  verify:
    name: Verificação
    needs: guard-tag-on-main
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  deploy-producao:
    name: Deploy em produção
    runs-on: ubuntu-latest
    needs: verify
    environment: producao
    steps:
      - name: Disparar deploy no Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

  release-artifacts:
    name: Artefatos da release (SBOM + JAR)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Empacotar aplicação
        run: mvn -B package -DskipTests

      - name: Gerar SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Publicar release com JAR, SBOM e notas automáticas
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            target/*.jar
            sbom.cyclonedx.json
